  <main class="report"><header><p class="eyebrow">COASTAL STATION 04 · 24H LOG</p><h1>潮汐不是背景，<br>是城市的時鐘。</h1></header><div class="layout"><article><section data-chapter="1"><span>01 · 05:10</span><h2>水線退去</h2><p>清晨的第一筆資料不是高度，而是泥灘重新出現的速度。</p></section><section data-chapter="2"><span>02 · 10:40</span><h2>港口呼吸</h2><p>船隻與堤岸之間，潮差改寫了每一次靠泊的角度。</p></section><section data-chapter="3"><span>03 · 16:20</span><h2>最高水位</h2><p>警戒線並非抽象數字，它與街道、排水和回家的路重疊。</p></section><section data-chapter="4"><span>04 · 22:55</span><h2>夜潮回落</h2><p>儀器歸零以前，紙帶保留了今天完整的一次呼吸。</p></section></article><aside aria-label="潮位儀表"><div class="gauge"><i></i><b id="level">0.8 M</b></div><p id="chapter">CHAPTER 01</p><div class="wave" aria-hidden="true"></div></aside></div></main>
