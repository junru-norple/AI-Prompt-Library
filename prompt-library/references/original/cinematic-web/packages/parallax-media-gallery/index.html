<html lang="zh-Hant" data-cinematic-id="cinematic-web:parallax-media-gallery" data-preview-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>遠征接觸表視差畫廊</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f0e7;--muted:#aaa59b;--paper:#090b10;--accent:#e9b872;--line:rgba(255,255,255,.16);font-family:"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{overflow-x:hidden}
    button,a{font:inherit}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .eyebrow{margin:0;font:700 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
    .preview-badge{position:fixed;z-index:30;top:12px;right:12px;padding:7px 10px;border:1px solid var(--line);background:rgba(5,7,11,.72);backdrop-filter:blur(10px);font:700 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--muted)}
    :root{--paper:#d9d4c5;--ink:#1f2926;--muted:#5f665e;--accent:#c95734;--line:rgba(31,41,38,.24);color-scheme:light}
    .field{display:grid;grid-template-columns:minmax(220px,32vw) 1fr;gap:clamp(28px,7vw,110px);padding:clamp(28px,6vw,86px);background-image:repeating-radial-gradient(ellipse at 10% 18%,transparent 0 26px,rgba(31,41,38,.05) 27px 28px)}aside{position:sticky;top:32px;align-self:start;height:calc(100svh - 64px);display:flex;flex-direction:column}aside h1{font:500 clamp(48px,7vw,102px)/.86 Georgia,serif;margin:.5em 0}nav{display:grid;gap:8px;margin-top:auto}nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding:8px 0;font:700 12px ui-monospace,monospace}.altitude{font:11px ui-monospace,monospace;color:var(--accent)}.reel{display:grid;gap:18vh;padding:12vh 0 24vh}figure{margin:0;will-change:transform}figure:nth-child(even){width:72%;margin-left:auto}.poster{aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid var(--ink);background:#86918b}.poster:before,.poster:after,.poster i{content:"";position:absolute;inset:auto}.glacier:before{left:-10%;right:-10%;bottom:-2%;height:68%;background:linear-gradient(155deg,transparent 30%,#eef1e8 31% 48%,#8ea8a5 49% 58%,#243838 59%);clip-path:polygon(0 100%,15% 36%,32% 67%,54% 12%,69% 55%,84% 29%,100% 100%)}.ridge{background:linear-gradient(#b7c0b5,#777f73)}.ridge:before{inset:25% -10% 0;background:#27322f;clip-path:polygon(0 100%,22% 30%,43% 68%,65% 15%,100% 100%)}.camp{background:linear-gradient(#806a58 0 48%,#2b302b 49%)}.camp:before{width:40%;height:28%;left:30%;bottom:24%;background:#d45d32;clip-path:polygon(50% 0,100% 100%,0 100%)}.return{background:linear-gradient(#d98558,#363433 55%)}.return:after{left:0;right:0;bottom:0;height:40%;background:#111915;clip-path:polygon(0 45%,25% 10%,50% 50%,76% 5%,100% 30%,100% 100%,0 100%)}figcaption{margin-top:8px;font:11px ui-monospace,monospace;letter-spacing:.1em}@media(max-width:700px){.field{grid-template-columns:1fr}aside{position:relative;height:auto}nav{margin-top:20px}.reel{gap:12vh;padding-top:3vh}figure:nth-child(even){width:84%}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <span class="preview-badge" aria-hidden="true">OFFLINE · ISOLATED</span>
  <main class="field"><aside><p class="eyebrow">RIDGE SURVEY · 04 FRAMES</p><h1>霧線以上</h1><nav aria-label="畫廊索引"><a href="#frame-a">A / 冰河</a><a href="#frame-b">B / 稜線</a><a href="#frame-c">C / 營地</a><a href="#frame-d">D / 回程</a></nav><p class="altitude">2,480—3,120 M</p></aside><section class="reel"><figure id="frame-a" data-depth=".18"><div class="poster glacier"><i></i></div><figcaption>A · 06:42 · 冰河入口</figcaption></figure><figure id="frame-b" data-depth="-.12"><div class="poster ridge"><i></i></div><figcaption>B · 09:18 · 北向稜線</figcaption></figure><figure id="frame-c" data-depth=".1"><div class="poster camp"><i></i></div><figcaption>C · 17:06 · 風口營地</figcaption></figure><figure id="frame-d" data-depth="-.16"><div class="poster return"><i></i></div><figcaption>D · 20:31 · 最後一道光</figcaption></figure></section></main>
  <script>
  (()=>{
    'use strict';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const runtime={id:'cinematic-web:parallax-media-gallery',ready:false,reducedMotion:reduced,activeRaf:0,activeTimers:0,disposed:false,theme:'FIELD NOTES / GALLERY'};
    window.__CINEMATIC_PREVIEW_STATE__=runtime;
    const disposers=[];
    window.__cinematicDispose=(fn)=>{if(typeof fn==='function')disposers.push(fn)};
    const finish=()=>{runtime.ready=true;document.documentElement.dataset.previewReady='true'};
    const items=[...document.querySelectorAll('[data-depth]')];let queued=0;const update=()=>{queued=0;runtime.activeRaf=0;if(reduced){for(const item of items)item.style.transform='';return}const center=innerHeight/2;for(const item of items){const box=item.getBoundingClientRect();const delta=Math.max(-1,Math.min(1,(box.top+box.height/2-center)/innerHeight));item.style.transform='translate3d(0,'+(delta*Number(item.dataset.depth)*120)+'px,0)'}};const onScroll=()=>{if(!queued){queued=requestAnimationFrame(update);runtime.activeRaf=1}};addEventListener('scroll',onScroll,{passive:true});update();__cinematicDispose(()=>{removeEventListener('scroll',onScroll);if(queued)cancelAnimationFrame(queued)});
    finish();
    addEventListener('pagehide',()=>{for(const dispose of disposers.splice(0)){try{dispose()}catch(_){}}runtime.activeRaf=0;runtime.activeTimers=0;runtime.disposed=true},{once:true});
  })();
  </script>
</body>
</html>
