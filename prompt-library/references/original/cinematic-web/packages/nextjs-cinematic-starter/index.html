<!doctype html>

<html lang="zh-Hant" data-cinematic-id="cinematic-web:nextjs-cinematic-starter" data-preview-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>建築編輯式 Next.js 高質感網站起始套件</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f0e7;--muted:#aaa59b;--paper:#090b10;--accent:#e9b872;--line:rgba(255,255,255,.16);font-family:"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{overflow-x:hidden}
    button,a{font:inherit}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .eyebrow{margin:0;font:700 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
    .preview-badge{position:fixed;z-index:30;top:12px;right:12px;padding:7px 10px;border:1px solid var(--line);background:rgba(5,7,11,.72);backdrop-filter:blur(10px);font:700 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--muted)}
    :root{--paper:#e8e5db;--ink:#102e63;--muted:#64728a;--accent:#eb4e32;--line:rgba(16,46,99,.25);color-scheme:light}
    .practice{min-height:100svh;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:8.333vw 100%}.skip{position:absolute;left:-999px}.skip:focus{left:14px;top:14px;z-index:10;background:var(--paper);padding:10px;color:var(--ink)}header{height:76px;padding:0 clamp(22px,4vw,58px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink)}nav{display:flex;gap:28px}nav a{color:var(--ink);text-decoration:none;font-weight:700}.hero{min-height:calc(100svh - 76px);padding:clamp(34px,6vw,90px);display:grid;grid-template-columns:1.15fr .85fr;gap:6vw;align-items:center}.hero span,.projects span{font:700 11px ui-monospace,monospace;color:var(--accent)}h1{font:700 clamp(50px,7.8vw,126px)/.82 "Arial Narrow",Arial,sans-serif;letter-spacing:-.065em;margin:.25em 0}.hero p{max-width:40rem;line-height:1.6;color:var(--muted)}.model{aspect-ratio:3/4;position:relative;border:1px solid var(--ink);background:linear-gradient(135deg,transparent 0 28%,var(--ink) 29% 30%,transparent 31%),linear-gradient(45deg,var(--accent) 0 18%,transparent 19%)}.model:before,.model:after,.model i,.model b{content:"";position:absolute;border:1px solid var(--ink)}.model:before{inset:8% 22% 40% 8%;background:var(--paper)}.model:after{inset:40% 8% 9% 36%;background:var(--ink)}.model i{inset:15% 33% 54% 17%;background:var(--accent)}.model b{inset:51% 17% 18% 47%;border-color:var(--paper)}.projects{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink)}.projects article{padding:clamp(40px,7vw,110px);min-height:54svh;border-right:1px solid var(--ink)}.projects h2,.method h2{font:500 clamp(42px,6vw,92px)/.9 Georgia,serif;margin:.4em 0}.projects p{color:var(--muted)}.method{padding:14vw 6vw;border-top:1px solid var(--ink)}@media(max-width:740px){.practice{background-size:25vw 100%}.hero,.projects{grid-template-columns:1fr}.model{max-height:52svh}.projects article{border-right:0;border-bottom:1px solid var(--ink)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <span class="preview-badge" aria-hidden="true">OFFLINE · ISOLATED</span>
  <main class="practice"><a class="skip" href="#projects">跳至作品</a><header><p class="eyebrow">COBALT PRACTICE · STATIC EXPORT</p><nav><a href="#projects">作品</a><a href="#method">方法</a></nav></header><section class="hero"><div><span>ARCHITECTURE / 2026</span><h1>空間從一條<br>可驗證的線開始。</h1><p>Next.js、React、TypeScript 與 Motion 的靜態輸出骨架；此頁為相同設計成果的 file:// Preview。</p></div><div class="model" aria-label="程序式建築模型示意"><i></i><b></b></div></section><section id="projects" class="projects"><article><span>01 / PUBLIC</span><h2>潮線劇場</h2><p>城市與海面共享的公共剖面。</p></article><article><span>02 / LIVING</span><h2>光井住宅</h2><p>用日照而不是牆面組織一天。</p></article></section><section id="method" class="method"><p class="eyebrow">METHOD</p><h2>研究、切面、原型、回看。</h2></section></main>
  <script>
  (()=>{
    'use strict';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const runtime={id:'cinematic-web:nextjs-cinematic-starter',ready:false,reducedMotion:reduced,activeRaf:0,activeTimers:0,disposed:false,theme:'COBALT PRACTICE / STARTER'};
    window.__CINEMATIC_PREVIEW_STATE__=runtime;
    const disposers=[];
    window.__cinematicDispose=(fn)=>{if(typeof fn==='function')disposers.push(fn)};
    const finish=()=>{runtime.ready=true;document.documentElement.dataset.previewReady='true'};
    document.querySelectorAll('a[href^="#"]').forEach((link)=>link.addEventListener('click',(event)=>{const target=document.querySelector(link.getAttribute('href'));if(!target)return;event.preventDefault();target.scrollIntoView({behavior:reduced?'auto':'smooth'});target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}));
    finish();
    addEventListener('pagehide',()=>{for(const dispose of disposers.splice(0)){try{dispose()}catch(_){}}runtime.activeRaf=0;runtime.activeTimers=0;runtime.disposed=true},{once:true});
  })();
  </script>
</body>
</html>
