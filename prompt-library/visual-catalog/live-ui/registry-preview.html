  <style data-local-source="registry-preview.css">:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #f6f7f5; background: #0e1418; }

.registry-preview-adapter { --accent: #88a7ff; --accent-2: #8ce6c0; --ink: #f6f7f5; --muted: #aab6bd; --panel: #172027; --line: rgba(255,255,255,.16); position: relative; width: min(100%, 34rem); min-height: 15.6rem; display: grid; align-content: center; gap: .8rem; padding: clamp(.8rem, 3vw, 1.25rem); border: 1px solid var(--line); border-radius: 1rem; background: var(--panel); box-shadow: 0 1.5rem 4rem rgba(0,0,0,.3); isolation: isolate; overflow: hidden; }
.registry-preview-adapter::before { content: ''; position: absolute; z-index: -1; width: 5rem; height: .38rem; right: 1.25rem; top: 0; background: var(--accent); }
.preview-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .8rem; }

.preview-title { margin: 0; color: var(--ink); font-size: clamp(1.05rem, 4vw, 1.55rem); line-height: 1.05; letter-spacing: -.03em; }
.preview-kind { flex: 0 0 auto; padding: .28rem .45rem; border: 1px solid var(--line); border-radius: .35rem; color: var(--muted); font: 700 .58rem/1 ui-monospace, monospace; text-transform: uppercase; }
.demo-surface { position: relative; min-height: 8.4rem; display: grid; place-items: center; padding: .8rem; border: 1px solid var(--line); border-radius: .75rem; background: rgba(0,0,0,.18); overflow: hidden; perspective: 800px; }
.preview-foot { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.preview-status { margin: 0; min-width: 0; color: var(--muted); font-size: .7rem; line-height: 1.35; }
.demo-action { min-height: 2rem; padding: .42rem .68rem; border: 1px solid var(--line); border-radius: .45rem; color: var(--ink); background: rgba(255,255,255,.06); transition: transform .2s ease, color .2s ease, background .2s ease; }
.demo-action:hover, .demo-action.is-active { color: #0d1418; background: var(--accent-2); transform: translateY(-2px); }
.demo-action:active { transform: translateY(1px) scale(.98); }
.visual-stack { width: min(100%, 22rem); display: grid; gap: .45rem; }
.visual-row, .visual-card { min-height: 2.05rem; display: flex; align-items: center; gap: .55rem; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: .5rem; background: rgba(255,255,255,.05); transition: transform .25s ease, background .25s ease; }
.visual-row:hover, .visual-card:hover { transform: translateX(.2rem); background: rgba(255,255,255,.09); }
.visual-dot { width: .6rem; height: .6rem; flex: 0 0 auto; border-radius: 50%; background: var(--accent); }
.visual-copy { flex: 1; height: .35rem; border-radius: 1rem; background: color-mix(in srgb, var(--muted) 45%, transparent); }
.visual-copy.short { flex: 0 0 28%; }
.visual-grid { width: min(100%, 23rem); display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .45rem; }
.visual-card { min-height: 4.5rem; align-items: flex-end; background: color-mix(in srgb, var(--accent) 10%, rgba(255,255,255,.03)); }
.visual-card:nth-child(2) { transform: translateY(-.35rem); }
.visual-card strong { font-size: .72rem; }
.visual-text { position: relative; color: var(--ink); font-weight: 800; font-size: clamp(1.55rem,7vw,3.2rem); letter-spacing: -.06em; text-align: center; }
.visual-text span { display: inline-block; animation: glyph-rise 2.4s cubic-bezier(.2,.8,.2,1) infinite; animation-delay: calc(var(--i) * -.09s); }
.visual-effects { position: absolute; inset: 0; }
.visual-effects i { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: calc(.2rem + var(--s) * .08rem); height: calc(.2rem + var(--s) * .08rem); border-radius: 50%; background: var(--accent); animation: particle-drift calc(2.8s + var(--s) * .35s) ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.17s); }
.effect-core { position: relative; width: 5.2rem; height: 5.2rem; border: 2px solid var(--accent); border-radius: 50%; background: color-mix(in srgb, var(--accent-2) 14%, var(--panel)); animation: core-pulse 2.6s ease-in-out infinite alternate; }
.effect-core::before, .effect-core::after { content: ''; position: absolute; inset: -.65rem; border: 1px solid color-mix(in srgb, var(--accent-2) 55%, transparent); border-radius: inherit; animation: orbit 5s linear infinite; }
.effect-core::after { inset: -1.25rem; animation-direction: reverse; animation-duration: 7s; }
.control-demo { width: min(100%, 20rem); display: grid; gap: .6rem; }
.control-field { width: 100%; min-height: 2.6rem; padding: .65rem .75rem; border: 1px solid var(--line); border-radius: .5rem; outline: 0; color: var(--ink); background: rgba(0,0,0,.2); }
.control-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.control-meter { height: .55rem; border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
.control-meter::before { content: ''; display: block; width: 68%; height: 100%; background: var(--accent); animation: meter 3s ease-in-out infinite alternate; }
.calendar-grid { width: min(100%, 19rem); display: grid; grid-template-columns: repeat(7,1fr); gap: .25rem; }
.calendar-grid i { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--line); border-radius: .25rem; color: var(--muted); font: 600 .62rem/1 ui-monospace,monospace; }
.calendar-grid i.is-today { color: #0d1418; border-color: var(--accent-2); background: var(--accent-2); }
.chart-bars { width: min(100%, 20rem); height: 6.2rem; display: flex; align-items: flex-end; justify-content: center; gap: .4rem; border-bottom: 1px solid var(--line); }
.chart-bars i { width: 12%; height: calc(var(--h) * 1%); background: var(--accent); transform-origin: bottom; animation: bar-grow 2.2s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.16s); }
.device-frame { width: min(12rem,70%); height: 7.4rem; padding: .45rem; border: 1px solid var(--line); border-radius: .8rem; background: #080b0d; box-shadow: 0 1rem 2rem rgba(0,0,0,.3); transform: rotateX(4deg) rotateY(calc((var(--pointer-x, .5) - .5) * 7deg)); }
.device-screen { height: 100%; display: grid; align-content: end; gap: .28rem; padding: .55rem; border-radius: .45rem; background: var(--accent); }
.device-screen i { display: block; height: .3rem; border-radius: 1rem; background: rgba(255,255,255,.6); }
.device-screen i:last-child { width: 58%; }
.source-retro-ui-oss { --accent: #ffdd33; --accent-2: #ff6c9b; --ink: #111; --muted: #292929; --panel: #f4efe6; --line: #111; color-scheme: light; border: 3px solid #111; border-radius: .15rem; box-shadow: .45rem .45rem 0 #111; }
.source-retro-ui-oss::before { display: none; }

.source-retro-ui-oss .demo-action { color: #111; border: 2px solid #111; border-radius: .1rem; background: var(--accent); box-shadow: .18rem .18rem 0 #111; font-weight: 800; }
.source-retro-ui-oss .demo-action:hover, .source-retro-ui-oss .demo-action.is-active { color: #111; background: var(--accent-2); transform: translate(.12rem,.12rem); box-shadow: .06rem .06rem 0 #111; }
.source-retro-ui-oss .preview-kind { color: #111; border: 2px solid #111; border-radius: 0; background: #fff; }
.source-retro-ui-oss .visual-dot, .source-retro-ui-oss .chart-bars i { box-shadow: none; }
.source-retro-ui-oss .device-screen { background: #ffdd33; }
.source-magic-ui-oss { --accent: #a78bfa; --accent-2: #67e8f9; --panel: #100d1c; background: #100d1c; border-top-color: #a78bfa; }
.source-smooth-ui-oss { --accent: #75a7ff; --accent-2: #8ce6c0; --panel: #121b25; background: #121b25; border-left-color: #75a7ff; }
.source-smooth-ui-oss .visual-row, .source-smooth-ui-oss .visual-card, .source-smooth-ui-oss .demo-action { border-radius: .75rem; }

@keyframes glyph-rise { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-.35rem); opacity: 1; } }
@keyframes particle-drift { to { transform: translate(calc((var(--pointer-x,.5) - .5) * 1rem),-1rem) scale(1.4); opacity: .35; } }

@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes meter { to { width: 92%; } }
@keyframes bar-grow { 50% { transform: scaleY(.72); opacity: .7; } }

<body>
  <main id="preview" aria-live="polite"><section id="stage" class="registry-preview-adapter" data-preview-key=""></section></main>
  <script data-local-source="registry-preview.js">(() => {
  'use strict';

  const root = document.querySelector('#stage');
  const allowedSources = new Set(['retro-ui-oss', 'magic-ui-oss', 'smooth-ui-oss']);
  const sourceLabels = Object.freeze({
    'retro-ui-oss': 'Retro UI / NeoBrutalism',
    'magic-ui-oss': 'Magic UI',
    'smooth-ui-oss': 'SmoothUI'
  });
  const kindLabels = Object.freeze({ data: '資料', input: '輸入', grid: '網格', text: '文字', effect: '動效', device: '裝置', control: '控制項', layout: '版面', component: '元件' });

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function humanize(value) {
    return value.split('-').filter(Boolean).map((part) => part.length <= 3 ? part.toUpperCase() : `${part[0].toUpperCase()}${part.slice(1)}`).join(' ');
  }

  function visualKind(slug) {
    if (/(chart|graph|ticker|number|progress|meter|stats)/.test(slug)) return 'data';
    if (/(input|form|select|combobox|search|textarea|otp|scrubber|slider|upload)/.test(slug)) return 'input';
    if (/(calendar|table|pagination|date)/.test(slug)) return 'grid';
    if (/(text|word|letter|type|shimmer|scramble|reveal|blur|axis|kinetic|shine)/.test(slug)) return 'text';
    if (/(background|grid|particle|meteor|ripple|aurora|beam|orbit|glow|shader|transition|loader|orb|warp|noise|light)/.test(slug)) return 'effect';
    if (/(android|iphone|safari|device|browser|video)/.test(slug)) return 'device';
    if (/(button|switch|toggle|checkbox|radio|badge|tooltip|popover|menu|dialog|drawer|tabs|accordion|toast)/.test(slug)) return 'control';
    if (/(card|bento|list|team|feature|hero|footer|header|pricing|testimonial|faq|layout|stack|dock|tree|navigation|breadcrumb|sidebar|template)/.test(slug)) return 'layout';
    return 'component';
  }

  function addStack(surface, rows = 3) {
    const stack = element('div', 'visual-stack');
    for (let index = 0; index < rows; index += 1) {
      const row = element('div', 'visual-row');
      row.append(element('i', 'visual-dot'), element('i', 'visual-copy'), element('i', 'visual-copy short'));
      stack.append(row);
    }
    surface.append(stack);
  }

  function addLayout(surface) {
    const grid = element('div', 'visual-grid');
    ['主要區塊', '訊號', '操作'].forEach((label) => {
      const card = element('div', 'visual-card');
      card.append(element('strong', '', label));
      grid.append(card);
    });
    surface.append(grid);
  }

  function addText(surface, title) {
    const text = element('div', 'visual-text');
    [...title.slice(0, 14)].forEach((character, index) => {
      const glyph = element('span', '', character === ' ' ? '\u00a0' : character);
      glyph.style.setProperty('--i', index);
      text.append(glyph);
    });
    surface.append(text);
  }

  function addEffect(surface) {
    const particles = element('div', 'visual-effects');
    const points = [[8,18,2],[22,72,1],[38,28,3],[51,82,2],[65,16,1],[78,66,3],[91,31,2],[13,48,1],[86,84,1],[56,47,2],[31,91,1],[72,39,1]];
    points.forEach(([x,y,size], index) => {
      const particle = element('i');
      particle.style.cssText = `--x:${x};--y:${y};--s:${size};--i:${index}`;
      particles.append(particle);
    });
    surface.append(particles, element('div', 'effect-core'));
  }

  function addInput(surface, status) {
    const control = element('div', 'control-demo');
    const input = element('input', 'control-field');
    input.type = 'text';
    input.placeholder = '輸入文字以在本機測試';
    input.setAttribute('aria-label', '本機預覽輸入欄');
    input.addEventListener('input', () => { status.textContent = input.value ? `${input.value.length} 個本機字元` : '待命 · 無網路'; });
    control.append(input, element('div', 'control-meter'));
    surface.append(control);
  }

  function addGrid(surface) {
    const grid = element('div', 'calendar-grid');
    for (let index = 1; index <= 21; index += 1) grid.append(element('i', index === 11 ? 'is-today' : '', String(index)));
    surface.append(grid);
  }

  function addData(surface) {
    const bars = element('div', 'chart-bars');
    [42,68,54,86,62,94].forEach((height, index) => {
      const bar = element('i');
      bar.style.cssText = `--h:${height};--i:${index}`;
      bars.append(bar);
    });
    surface.append(bars);
  }

  function addDevice(surface) {
    const device = element('div', 'device-frame');
    const screen = element('div', 'device-screen');
    screen.append(element('i'), element('i'), element('i'));
    device.append(screen);
    surface.append(device);
  }

  function render() {
    const decoded = decodeURIComponent(location.hash.slice(1));
    const [sourceId, slug] = decoded.split('::');
    if (!new Set(["magic-ui-oss::android","magic-ui-oss::animated-beam","magic-ui-oss::animated-circular-progress-bar","magic-ui-oss::animated-gradient-text","magic-ui-oss::animated-grid-pattern","magic-ui-oss::animated-list","magic-ui-oss::animated-shiny-text","magic-ui-oss::animated-theme-toggler","magic-ui-oss::aurora-text","magic-ui-oss::avatar-circles","magic-ui-oss::backlight","magic-ui-oss::bento-grid","magic-ui-oss::blur-fade","magic-ui-oss::border-beam","magic-ui-oss::client-tweet-card","magic-ui-oss::code-comparison","magic-ui-oss::comic-text","magic-ui-oss::confetti","magic-ui-oss::cool-mode","magic-ui-oss::dia-text-reveal","magic-ui-oss::dock","magic-ui-oss::dot-pattern","magic-ui-oss::dotted-map","magic-ui-oss::file-tree","magic-ui-oss::flickering-grid","magic-ui-oss::glare-hover","magic-ui-oss::globe","magic-ui-oss::glyph-matrix","magic-ui-oss::grid-pattern","magic-ui-oss::hero-video-dialog","magic-ui-oss::hexagon-pattern","magic-ui-oss::highlighter","magic-ui-oss::hyper-text","magic-ui-oss::icon-cloud","magic-ui-oss::interactive-grid-pattern","magic-ui-oss::interactive-hover-button","magic-ui-oss::iphone","magic-ui-oss::kinetic-text","magic-ui-oss::lens","magic-ui-oss::light-rays","magic-ui-oss::line-shadow-text","magic-ui-oss::magic-card","magic-ui-oss::marquee","magic-ui-oss::meteors","magic-ui-oss::morphing-text","magic-ui-oss::neon-gradient-card","magic-ui-oss::noise-texture","magic-ui-oss::number-ticker","magic-ui-oss::orbiting-circles","magic-ui-oss::particles","magic-ui-oss::pixel-image","magic-ui-oss::pointer","magic-ui-oss::progressive-blur","magic-ui-oss::pulsating-button","magic-ui-oss::rainbow-button","magic-ui-oss::retro-grid","magic-ui-oss::ripple","magic-ui-oss::ripple-button","magic-ui-oss::safari","magic-ui-oss::scroll-based-velocity","magic-ui-oss::scroll-progress","magic-ui-oss::shimmer-button","magic-ui-oss::shine-border","magic-ui-oss::shiny-button","magic-ui-oss::smooth-cursor","magic-ui-oss::sparkles-text","magic-ui-oss::spinnin
