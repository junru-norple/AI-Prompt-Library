<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="prompt-library-preview" content="offline-sandboxed-adaptation">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; media-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Kokonut UI local preview</title>
  <style data-local-source="kokonut-preview.css">:root {
  color-scheme: dark;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #f4f1ea;
  background: #0d0e11;
  --acid: #d8ff48;
  --violet: #9b7cff;
  --coral: #ff735c;
  --line: rgba(244, 241, 234, .16);
}

* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; overflow-x: clip; }
body { min-height: 100vh; background: #0d0e11; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }

#preview {
  min-height: 100vh;
  padding: clamp(1rem, 4vw, 2rem);
  display: grid;
  place-items: center;
  isolation: isolate;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 20%, rgba(155, 124, 255, .2), transparent 34%),
    radial-gradient(circle at 82% 84%, rgba(216, 255, 72, .14), transparent 30%),
    #0d0e11;
}

.stage { width: min(100%, 38rem); min-height: 13rem; display: grid; place-items: center; position: relative; }
.k-panel { width: min(100%, 28rem); padding: 1.15rem; border: 1px solid var(--line); border-radius: 1.25rem; background: rgba(20, 22, 27, .88); box-shadow: 0 1.5rem 5rem rgba(0,0,0,.35); }
.k-eyebrow { margin: 0 0 .65rem; color: var(--acid); font: 700 .72rem/1.2 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
.k-title { margin: 0; font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1.05; letter-spacing: -.045em; }
.k-copy { margin: .75rem 0 0; color: #aaa7a0; font-size: .92rem; line-height: 1.55; }
.k-row { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: .55rem; }
.k-button { min-height: 2.6rem; padding: .65rem 1rem; border: 1px solid var(--line); border-radius: 999px; color: #f4f1ea; background: #181a20; transition: transform .2s ease, color .2s ease, background .2s ease; }
.k-button:hover, .k-button.is-active { color: #0d0e11; border-color: var(--acid); background: var(--acid); transform: translateY(-2px); }
.k-button.primary { color: #0d0e11; border-color: var(--acid); background: var(--acid); }
.k-button.primary:active { transform: translateY(1px) scale(.98); }
.k-field { width: 100%; min-height: 3rem; padding: .8rem 1rem; border: 1px solid var(--line); border-radius: .8rem; outline: 0; color: #f4f1ea; background: #101217; }
.k-field:focus { border-color: var(--acid); box-shadow: 0 0 0 2px rgba(216,255,72,.18); }
textarea.k-field { min-height: 6.5rem; resize: none; }
.k-status { min-height: 1.5rem; margin: .75rem 0 0; color: #bbb7ae; font-size: .82rem; }
.k-card { width: min(100%, 25rem); padding: 1.2rem; border: 1px solid var(--line); border-radius: 1.4rem; background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025)); transform-style: preserve-3d; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.k-card:hover { transform: rotateX(3deg) rotateY(-4deg) translateY(-4px); }
.k-stat { margin-top: 1rem; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem; }
.k-stat span { padding: .75rem .35rem; border-radius: .75rem; background: rgba(255,255,255,.055); text-align: center; }
.k-stat strong { display: block; color: var(--acid); font-size: 1.15rem; }
.k-stat small { color: #99958d; font-size: .7rem; }
.k-nav { display: flex; gap: .35rem; padding: .35rem; border: 1px solid var(--line); border-radius: 999px; background: #101217; }
.k-nav button { min-height: 2.35rem; padding: .55rem .9rem; border: 0; border-radius: 999px; color: #aaa7a0; background: transparent; }
.k-nav button.is-active { color: #0d0e11; background: var(--acid); }
.k-view { width: min(100%, 28rem); display: grid; gap: 1rem; }
.k-content { min-height: 7rem; padding: 1rem; border: 1px solid var(--line); border-radius: 1rem; color: #c9c5bc; background: rgba(255,255,255,.035); }
.k-orb { position: absolute; width: 4rem; aspect-ratio: 1; border-radius: 50%; background: var(--violet); filter: blur(.2px); animation: float 3.2s ease-in-out infinite alternate; }
.k-orb:nth-child(2) { width: 2.5rem; left: 16%; top: 12%; background: var(--acid); animation-delay: -.8s; }
.k-orb:nth-child(3) { width: 5rem; right: 10%; bottom: 8%; background: var(--coral); animation-delay: -1.6s; }
.k-beam { position: absolute; width: 45%; height: 2px; left: 5%; top: calc(12% + var(--i) * 9%); transform: rotate(calc(-16deg + var(--i) * 3deg)); transform-origin: right; background: linear-gradient(90deg, transparent, var(--acid)); animation: pulse 1.8s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.12s); }
.k-text { position: relative; font-size: clamp(2rem, 9vw, 4.8rem); font-weight: 800; line-height: .95; letter-spacing: -.07em; text-align: center; }
.k-text.shimmer { color: transparent; background: linear-gradient(100deg, #777 25%, #fff 50%, #777 75%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; animation: shimmer 2.4s linear infinite; }
.k-text.glitch::before, .k-text.glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; }
.k-text.glitch::before { color: var(--coral); transform: translate(-2px,1px); clip-path: inset(10% 0 55%); animation: glitch 1.4s steps(2,end) infinite; }
.k-text.glitch::after { color: var(--acid); transform: translate(2px,-1px); clip-path: inset(58% 0 8%); animation: glitch 1.1s steps(2,end) infinite reverse; }
.k-matrix { color: var(--acid); font: 700 clamp(.8rem, 3vw, 1.2rem)/1.35 ui-monospace, monospace; letter-spacing: .12em; overflow-wrap: anywhere; }
.k-loader { display: flex; align-items: end; gap: .35rem; height: 5rem; }
.k-loader span { width: .65rem; height: 25%; border-radius: 999px; background: var(--acid); animation: wave 1s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.1s); }
.k-progress { height: .5rem; margin-top: 1rem; overflow: hidden; border-radius: 999px; background: #24262c; }
.k-progress span { display: block; width: 45%; height: 100%; background: var(--acid); animation: progress 2.2s ease-in-out infinite alternate; }
.k-chip { padding: .42rem .65rem; border: 1px solid var(--line); border-radius: 999px; color: #aaa7a0; font-size: .74rem; }

.adapter-stage { width: min(100%, 42rem); min-width: 0; max-height: calc(100vh - 1rem); padding: clamp(.8rem, 2.4vw, 1.25rem); overflow: auto; border: 1px solid var(--line); border-radius: 1.35rem; background: rgba(10,11,15,.9); box-shadow: 0 1.4rem 4rem rgba(0,0,0,.28); scrollbar-width: thin; }
.ai-loading-adapter, .ai-text-loading-adapter, .ai-voice-adapter, .apple-activity-adapter,
.attract-button-adapter, .beams-background-adapter, .bento-grid-adapter, .carousel-cards-adapter,
.currency-transfer-adapter, .dynamic-text-adapter, .flow-field-adapter, .gradient-button-adapter,
.liquid-glass-adapter, .loader-adapter, .matrix-text-adapter, .morphic-navbar-adapter,
.mouse-effect-card-adapter, .particle-button-adapter, .scroll-text-adapter, .shape-hero-adapter,
.shimmer-text-adapter, .sliced-text-adapter, .slide-text-button-adapter, .social-button-adapter,
.switch-button-adapter, .swoosh-text-adapter, .tweet-card-adapter { min-width: 0; contain: layout paint; }
.adapter-stage button:focus-visible, .adapter-stage input:focus-visible, .adapter-stage textarea:focus-visible, .adapter-stage select:focus-visible, .adapter-stage [tabindex]:focus-visible { outline: 3px solid rgba(216,255,72,.4); outline-offset: 3px; }
.action-search-adapter, .ai-input-search-adapter, .ai-prompt-adapter, .file-upload-adapter, .avatar-picker-adapter, .profile-dropdown-adapter, .team-selector-adapter { align-content: center; }

.action-search-shell { width: min(100%, 31rem); margin: auto; }
.action-search-input { min-height: 3.1rem; }
.action-search-results { display: grid; gap: .3rem; margin-top: .55rem; }

.action-search-option:hover, .action-search-option.is-active { background: rgba(155,124,255,.16); }

.ai-input-shell, .ai-prompt-shell { width: min(100%, 31rem); margin: auto; padding: .9rem; border: 1px solid var(--line); border-radius: 1rem; background: #11131a; }
.ai-input-textarea, .ai-prompt-textarea { min-height: 5rem; max-height: 8rem; }

.ai-search-toggle.is-active { color: #101114; border-color: var(--acid); background: var(--acid); }
.ai-model-select { min-height: 2.45rem; padding: .45rem .65rem; border: 1px solid var(--line); border-radius: .65rem; color: #e6e2da; background: #161820; }

.ai-loading-card { width: min(100%, 27rem); margin: auto; padding: 1rem; border: 1px solid var(--line); border-radius: 1rem; background: #11131a; }
.ai-code-lines { display: grid; gap: .42rem; }
.ai-code-line { display: grid; grid-template-columns: 1fr 5.5rem; align-items: center; gap: .7rem; color: #9c9992; font: .78rem/1.4 ui-monospace, monospace; }
.ai-code-line i { height: .45rem; overflow: hidden; border-radius: 99px; background: linear-gradient(90deg,#292c36 45%,#3b3f4d 55%,#292c36 65%); background-size: 220% 100%; animation: shimmer 1.5s linear infinite; }
.ai-code-line.is-done { color: #e9e5dd; }

.ai-loading-progress { height: .45rem; margin-top: .8rem; overflow: hidden; border-radius: 99px; background: #272a33; }
.ai-loading-progress span { display: block; width: 0; height: 100%; background: linear-gradient(90deg,var(--violet),var(--acid)); transition: width .4s ease; }

.ai-thinking-shell { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 7rem; }
.ai-thinking-glyph { color: var(--violet); font-size: 1.6rem; animation: orbit-pulse 1.2s ease-in-out infinite alternate; }

.ai-voice-shell { width: min(100%, 29rem); margin: auto; text-align: center; }

.ai-voice-waves span { width: .25rem; height: calc(12% + (var(--i) % 7) * 9%); border-radius: 99px; background: linear-gradient(var(--violet),var(--acid)); animation: voice-wave .8s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.045s); animation-play-state: paused; }
.ai-voice-shell.is-recording .ai-voice-waves span { animation-play-state: running; }
.ai-voice-time { display: block; margin: .2rem 0 .75rem; font: 700 1.3rem ui-monospace,monospace; }

.activity-card { width: min(100%, 32rem); margin: auto; display: grid; grid-template-columns: 1fr auto; gap: .8rem 1.2rem; padding: 1rem; border-radius: 1.35rem; color: #f8f5ef; background: linear-gradient(145deg,#23242b,#101116); }
.activity-rings { position: relative; width: 7.5rem; height: 7.5rem; }
.activity-ring { position: absolute; inset: calc(var(--i) * 1rem); border-radius: 50%; background: conic-gradient(var(--ring) var(--value),rgba(255,255,255,.08) 0); mask: radial-gradient(transparent 56%,#000 58%); animation: ring-enter .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * .1s); }
.activity-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .45rem; }
.activity-stats span { padding: .55rem; border-radius: .65rem; background: rgba(255,255,255,.05); }
.activity-stats small, .activity-stats strong { display: block; }
.activity-stats small { color: #aaa7a0; font-size: .68rem; }
.activity-stats strong { margin-top: .15rem; font-size: .86rem; }

.attract-field { position: relative; width: min(100%, 27rem); min-height: 11rem; display: grid; place-items: center; overflow: hidden; border-radius: 1rem; background: radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(216,255,72,.14),transparent 38%),#111319; }
.attract-core { position: relative; z-index: 2; min-height: 3.2rem; display: flex; align-items: center; gap: .6rem; padding: .75rem 1.2rem; border: 1px solid rgba(216,255,72,.5); border-radius: 99px; color: #111; background: var(--acid); transition: transform .15s ease; }
.attract-particle { position: absolute; width: .24rem; height: .24rem; left: calc(8% + (var(--i) * 7%)); top: calc(18% + (var(--i) % 4) * 20%); border-radius: 50%; background: var(--acid); opacity: .32; transition: transform .35s ease,opacity .35s ease; }
.attract-field:hover .attract-particle { transform: translate(calc((var(--mx,50%) - 50%) * .08),calc((var(--my,50%) - 50%) * .08)) scale(1.8); opacity: .8; }

.avatar-picker-card { width: min(100%, 27rem); margin: auto; text-align: center; }
.avatar-orbit { position: relative; height: 7.2rem; display: flex; align-items: center; justify-content: center; gap: .55rem; }
.avatar-choice { width: 3.2rem; height: 3.2rem; border: 3px solid transparent; border-radius: 50%; color: white; background: linear-gradient(145deg,hsl(var(--avatar-hue) 80% 58%),hsl(calc(var(--avatar-hue) + 55) 70% 35%)); transition: transform .25s ease,border-color .25s ease; }
.avatar-choice:hover { transform: translateY(-6px) rotate(calc((var(--i) - 1.5) * 4deg)); }
.avatar-choice.is-active { border-color: var(--acid); transform: scale(1.12); }
.avatar-selected { display: block; margin-bottom: .55rem; font-size: 1.1rem; }
.avatar-name { min-height: 2.75rem; }

.beams-stage { position: relative; min-height: 13rem; overflow: hidden; }
.beams-field { position: absolute; inset: 0; overflow: hidden; }
.beam-line { position: absolute; width: 46%; height: .12rem; left: calc(-12% + (var(--i) % 5) * 8%); top: calc(4% + var(--i) * 5%); transform: rotate(calc(-22deg + (var(--i) % 4) * 7deg)); background: linear-gradient(90deg,transparent,hsl(calc(190 + var(--i) * 4) 90% 65% / .7),transparent); filter: blur(.2px); animation: beam-travel calc(2.8s + (var(--i) % 5) * .35s) linear infinite; animation-delay: calc(var(--i) * -.13s); }
.beams-copy { position: relative; z-index: 1; text-align: center; text-shadow: 0 0 2rem #090a0f; }

.bento-stage { overflow: hidden; }
.bento-grid { width: min(100%, 35rem); display: grid; grid-template-columns: 1.25fr .75fr; gap: .55rem; }
.bento-item { position: relative; min-width: 0; min-height: 6rem; display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; padding: .75rem; overflow: hidden; border: 1px solid var(--line); border-radius: .9rem; color: #eae6df; background: linear-gradient(145deg,rgba(155,124,255,.12),rgba(255,255,255,.025)); text-align: left; transition: transform .2s ease,border-color .2s ease; }
.bento-item:hover, .bento-item.is-active { transform: translateY(-3px); border-color: rgba(216,255,72,.45); }
.bento-item small { color: #9c9992; }
.bento-index { margin-left: auto; color: var(--acid); font: .65rem ui-monospace,monospace; }
.bento-bars { width: 100%; height: 2.3rem; display: flex; align-items: end; gap: .18rem; margin-top: auto; }
.bento-bars i { flex: 1; height: calc(22% + (var(--i) % 5) * 16%); border-radius: .2rem .2rem 0 0; background: var(--violet); }

@keyframes voice-wave { to { height: calc(28% + (var(--i) % 5) * 13%); } }
@keyframes ring-enter { from { opacity: 0; transform: scale(.7) rotate(-90deg); } }
@keyframes beam-travel { from { translate: -35% 0; opacity: 0; } 40% { opacity: 1; } to { translate: 185% 0; opacity: 0; } }

.card-stack-adapter { min-height: 14rem; overflow: hidden; }
.card-stack { position: relative; width: min(100%, 25rem); height: 12rem; }
.stack-card { position: absolute; inset: 0; display: grid; grid-template-columns: 4rem 1fr; align-content: center; gap: .25rem .75rem; padding: 1rem; border: 1px solid var(--line); border-radius: 1.1rem; color: #eeeae2; background: linear-gradient(145deg,hsl(calc(238 + var(--i) * 18) 26% 20%),#101116); text-align: left; transform: translateY(calc(var(--i) * 1.15rem)) scale(calc(1 - var(--i) * .035)); transform-origin: top; transition: transform .35s ease,opacity .35s ease,z-index 0s; z-index: calc(5 - var(--i)); }
.stack-card:hover, .stack-card.is-active { transform: translateY(calc(var(--i) * .45rem - 1rem)) scale(1.03); z-index: 9; }
.stack-art { grid-row: span 2; width: 4rem; height: 4rem; display: grid; place-items: center; border-radius: .8rem; color: #111; background: var(--acid); font-weight: 800; }
.stack-card small { color: #aaa7a0; }

.carousel-shell { width: min(100%, 20rem); overflow: hidden; }
.carousel-viewport { display: flex; transition: transform .42s cubic-bezier(.2,.8,.2,1); }
.carousel-card { position: relative; min-width: 100%; min-height: 10rem; display: flex; flex-direction: column; justify-content: flex-end; gap: .25rem; padding: .9rem; overflow: hidden; border-radius: 1.1rem; background: linear-gradient(155deg,hsl(var(--card-hue) 65% 45%),#12131a 72%); }
.carousel-art { position: absolute; width: 7rem; height: 7rem; right: -1rem; top: -1rem; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; box-shadow: inset 0 0 0 1.2rem rgba(255,255,255,.05),inset 0 0 0 2.3rem rgba(255,255,255,.04); }
.carousel-favorite { position: absolute; z-index: 2; right: .7rem; top: .7rem; width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); border-radius: 50%; color: white; background: rgba(8,9,12,.55); }
.carousel-favorite.is-active { color: #ff6f91; }
.carousel-controls { display: flex; align-items: center; justify-content: center; gap: .55rem; margin-top: .55rem; }
.carousel-controls .k-status { margin: 0; min-width: 3rem; text-align: center; }

.transfer-card { width: min(100%, 27rem); margin: auto; }

.transfer-amounts span { padding: .65rem; border: 1px solid var(--line); border-radius: .7rem; background: rgba(255,255,255,.04); font: 700 .82rem ui-monospace,monospace; }

.transfer-steps { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .35rem; margin: .75rem 0; padding: 0; list-style: none; }
.transfer-steps li { display: grid; justify-items: center; gap: .25rem; color: #8f8c86; font-size: .7rem; }
.transfer-steps i { width: 1.3rem; height: 1.3rem; border: 2px solid #3a3d46; border-radius: 50%; }
.transfer-steps li.is-done { color: #e9e5dd; }
.transfer-steps li.is-done i { border-color: var(--acid); background: radial-gradient(circle,var(--acid) 40%,transparent 44%); }
.transfer-action { width: 100%; }

.dynamic-text-shell { min-height: 8rem; display: grid; justify-items: center; align-content: center; }
.dynamic-prefix { color: #9f9c96; font-size: clamp(1rem,3vw,1.35rem); }
.dynamic-word { color: var(--acid); font-size: clamp(2rem,8vw,4.6rem); line-height: .95; letter-spacing: -.065em; transform: translateY(.5em); opacity: 0; transition: transform .35s ease,opacity .35s ease; }
.dynamic-text-shell.is-entered .dynamic-word { transform: none; opacity: 1; }

.file-upload-shell { width: min(100%, 29rem); margin: auto; }
.file-drop-zone { min-height: 8rem; display: grid; place-items: center; align-content: center; gap: .25rem; padding: 1rem; border: 1px dashed rgba(216,255,72,.5); border-radius: 1rem; background: rgba(216,255,72,.035); text-align: center; transition: background .2s ease,transform .2s ease; }
.file-drop-zone.is-dragging, .file-drop-zone:hover { background: rgba(216,255,72,.1); transform: translateY(-2px); }
.file-drop-zone small { color: #99958d; }
.file-upload-icon { color: var(--acid); font-size: 1.8rem; }
.file-progress { height: .45rem; margin-top: .65rem; overflow: hidden; border-radius: 99px; background: #272a33; }
.file-progress span { display: block; width: 0; height: 100%; background: linear-gradient(90deg,var(--violet),var(--acid)); transition: width .16s linear; }

.flow-field-stage { position: relative; min-height: 13rem; overflow: hidden; }
.flow-field-canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #07090d; }
.flow-field-copy { position: relative; z-index: 1; pointer-events: none; text-align: center; text-shadow: 0 0 1rem #050609; }
.flow-field-copy strong { font-size: clamp(1.4rem,5vw,2.6rem); }

.glitch-text-adapter { text-align: center; }
.glitch-word { position: relative; color: white; font-size: clamp(2.6rem,12vw,6.5rem); line-height: 1; letter-spacing: .08em; }
.glitch-word::before, .glitch-word::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.glitch-word:hover::before, .glitch-word:hover::after, .glitch-word.is-active::before, .glitch-word.is-active::after { opacity: .75; animation: glitch-slice .7s steps(2,end) infinite; }
.glitch-word::before { color: #ff4d73; clip-path: inset(12% 0 55%); transform: translate(-3px,0); }
.glitch-word::after { color: #4deaff; clip-path: inset(62% 0 8%); transform: translate(3px,0); animation-direction: reverse !important; }

.gradient-action { position: relative; min-height: 3.5rem; display: flex; align-items: center; gap: .7rem; padding: .8rem 1.2rem; border: 0; border-radius: .9rem; color: #8aeeca; background: #0c1f21; box-shadow: inset 0 0 10px rgba(135,246,183,.1); isolation: isolate; transition: color .5s ease, box-shadow .5s ease; }

.loader-showcase { width: min(100%,28rem); margin: auto; text-align: center; }

@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

.morphic-nav { position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: .2rem; padding: .3rem; border: 1px solid var(--line); border-radius: 99px; background: #12141a; isolation: isolate; }
.morphic-indicator { position: absolute; z-index: -1; width: calc(25% - .15rem); height: calc(100% - .6rem); left: .3rem; top: .3rem; border-radius: 99px; background: var(--acid); transform: translateX(calc(var(--index,0) * 100% + var(--index,0) * .2rem)); transition: transform .38s cubic-bezier(.2,.8,.2,1); }

.mouse-effect-card { width: min(100%,29rem); padding: 1rem; overflow: hidden; border: 1px solid var(--line); border-radius: 1.2rem; background: radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(216,255,72,.16),transparent 42%),linear-gradient(145deg,#1b1d25,#0f1015); transform: perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition: transform .14s ease,border-color .2s ease; }

.particle-action-shell { position: relative; min-height: 8rem; display: grid; place-items: center; }

.profile-menu-shell { position: relative; width: min(100%,20rem); margin: auto; }
.profile-trigger { width: 100%; min-height: 3.2rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .6rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: .85rem; color: #efebe4; background: #15171e; text-align: left; }
.profile-avatar { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border-radius: 50%; color: #17181c; background: linear-gradient(145deg,var(--acid),var(--violet)); font-weight: 800; }
.profile-menu { position: absolute; z-index: 3; width: 100%; top: calc(100% + .4rem); padding: .35rem; border: 1px solid var(--line); border-radius: .85rem; background: #181a21; box-shadow: 0 1rem 3rem rgba(0,0,0,.4); }
.profile-menu-item { width: 100%; min-height: 2.4rem; display: grid; grid-template-columns: 1.4rem 1fr; align-items: center; gap: .45rem; padding: .45rem .55rem; border: 0; border-radius: .55rem; color: #d4d0c8; background: transparent; text-align: left; }

.scroll-text-viewport { position: relative; width: min(100%,28rem); height: 11rem; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--line); border-radius: 1rem; background: #0d0f14; scroll-behavior: smooth; }

.scroll-text-line { display: block; color: color-mix(in srgb,var(--acid) calc(22% + var(--i) * 14%),#565962); font-size: clamp(1.1rem,5vw,2rem); line-height: 1; letter-spacing: -.045em; transform: translateX(calc((var(--scroll,0) - .5) * (var(--i) - 2) * 1.5rem)); transition: transform .1s linear,color .2s ease; }
.scroll-text-spacer { height: 24rem; }

.shape-hero-stage { position: relative; min-height: 14rem; overflow: hidden; }
.shape-field { position: absolute; inset: 0; }
.hero-shape { position: absolute; width: calc(1.3rem + (var(--i) % 4) * .7rem); aspect-ratio: 1; left: calc(4% + var(--i) * 8%); top: -25%; border: 1px solid rgba(255,255,255,.22); background: hsl(calc(55 + var(--i) * 27) 80% 58% / .72); animation: shape-fall calc(4s + (var(--i) % 5) * .7s) linear infinite; animation-delay: calc(var(--i) * -.55s); }
.shape-1 { border-radius: 50%; }.shape-2 { clip-path: polygon(50% 0,100% 100%,0 100%); }.shape-3 { border-radius: 35% 65% 60% 40%; }
.shape-hero-stage.is-shuffled .hero-shape { animation-duration: 1.8s; }
.shape-hero-copy { position: relative; z-index: 1; width: min(100%,28rem); text-align: center; text-shadow: 0 0 1rem #0d0e11; }

.shimmer-word { color: transparent; background: linear-gradient(100deg,#555 15%,#fff 42%,var(--acid) 50%,#fff 58%,#555 85%); background-size: 240% 100%; background-clip: text; -webkit-background-clip: text; font-size: clamp(2rem,8vw,4.8rem); line-height: 1; letter-spacing: -.06em; animation: shimmer 2.5s linear infinite; transition: letter-spacing .35s ease; }
.shimmer-word.is-wide { letter-spacing: .02em; }

.sliced-word { position: relative; width: min(100%,24rem); min-height: 7rem; border: 0; color: white; background: transparent; font: 900 clamp(2.5rem,11vw,6rem)/1 system-ui,sans-serif; letter-spacing: -.07em; }
.sliced-word span { position: absolute; inset: 0; display: grid; place-items: center; transition: transform .35s cubic-bezier(.2,.8,.2,1); }

.sliced-word:hover .slice-top, .sliced-word.is-active .slice-top { transform: translateX(-.12em); }
.sliced-word:hover .slice-bottom, .sliced-word.is-active .slice-bottom { transform: translateX(.12em); color: var(--acid); }

.slide-text-action { position: relative; min-width: 12rem; height: 3.4rem; overflow: hidden; border: 1px solid var(--line); border-radius: 99px; color: #efebe4; background: #15171d; }

.slide-label.clone { color: #111; background: var(--acid); transform: translateY(100%); }
.slide-text-action:hover .slide-label:not(.clone), .slide-text-action.is-active .slide-label:not(.clone) { transform: translateY(-100%); }
.slide-text-action:hover .slide-label.clone, .slide-text-action.is-active .slide-label.clone { transform: translateY(0); }

.social-action-shell { position: relative; display: flex; align-items: center; justify-content: center; min-height: 5rem; }
.social-trigger, .social-item { width: 3.2rem; height: 3.2rem; border: 1px solid var(--line); border-radius: 50%; color: #111; background: var(--acid); }
.social-trigger { position: relative; z-index: 2; width: 5.5rem; border-radius: 99px; font-weight: 800; }
.social-items { position: absolute; display: flex; gap: .35rem; transition: transform .35s ease,opacity .25s ease; opacity: 0; transform: translateX(0) scale(.7); }
.social-action-shell.is-open .social-items { opacity: 1; transform: translateX(6.4rem) scale(1); }
.social-item { color: #e9e5dd; background: #1b1d24; }

.theme-switch-shell { width: min(100%,28rem); margin: auto; padding: 1rem; border-radius: 1.1rem; color: #ede9e1; background: #13151c; transition: color .3s ease,background .3s ease; }

.theme-preview { min-height: 5rem; }
.theme-toggle { min-height: 3rem; display: flex; align-items: center; gap: .55rem; padding: .45rem .8rem; border: 1px solid currentColor; border-radius: 99px; color: inherit; background: transparent; }
.theme-thumb { width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 50%; color: #111; background: var(--acid); transition: transform .3s ease; }
.theme-toggle[aria-checked='true'] .theme-thumb { transform: rotate(180deg); background: var(--violet); }

.swoosh-shell { position: relative; min-height: 9rem; display: grid; place-items: center; overflow: hidden; }
.swoosh-word { position: relative; z-index: 2; font: 900 italic clamp(3rem,14vw,7rem)/1 system-ui,sans-serif; letter-spacing: -.09em; }
.swoosh-trail { position: absolute; width: 16rem; height: 3.7rem; border-bottom: .55rem solid var(--acid); border-radius: 50%; transform: rotate(-9deg) translate(-2rem,.8rem); animation: swoosh-draw 2.1s ease-in-out infinite alternate; }

.team-selector-shell { width: min(100%,27rem); margin: auto; }

.team-option { width: 100%; min-height: 3.25rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .65rem; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: .8rem; color: #dcd8d1; background: #14161d; text-align: left; }
.team-option.is-active { border-color: var(--acid); background: rgba(216,255,72,.08); }
.team-avatar { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border-radius: .55rem; color: #111; background: linear-gradient(145deg,var(--acid),var(--violet)); font-weight: 800; }
.team-copy strong, .team-copy small { display: block; }.team-copy small { color: #99958d; }.team-option > i { color: var(--acid); opacity: 0; }.team-option.is-active > i { opacity: 1; }

.tweet-card { width: min(100%,29rem); margin: auto; padding: 1rem; border: 1px solid var(--line); border-radius: 1.1rem; background: radial-gradient(circle at var(--mx,10%) var(--my,10%),rgba(155,124,255,.14),transparent 45%),#111319; transition: border-color .2s ease,transform .2s ease; }

.tweet-actions { display: flex; gap: 1rem; padding-top: .65rem; border-top: 1px solid var(--line); color: #9d9a94; font-size: .75rem; }
.tweet-like { border: 0; color: inherit; background: transparent; }.tweet-like.is-active { color: #ff668b; }

@keyframes particle-burst { to { opacity: 0; transform: rotate(calc(var(--i) * 20deg)) translateY(-5.5rem) scale(.25); } }
@keyframes shape-fall { to { top: 120%; transform: rotate(240deg); } }
@keyframes swoosh-draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* Component-specific offline adaptations. Each selector maps to one audited source component. */
.command-button {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .65rem;
  min-height: 3rem; padding: .7rem 1rem; overflow: hidden; border: 1px solid #3f4148; border-radius: .75rem;
  color: #d7d7da; background: linear-gradient(#272a31, #16181d); box-shadow: inset 0 1px rgba(255,255,255,.08), 0 1rem 3rem rgba(0,0,0,.25);
  transition: border-color .25s ease, transform .25s ease;
}
.command-button:hover, .command-button[aria-pressed="true"] { border-color: #777b86; transform: translateY(-2px); }
.command-button:focus-visible { outline: 3px solid rgba(216,255,72,.38); outline-offset: 3px; }
.command-icon { font-size: 1.1rem; transition: transform .28s ease; }
.command-button:hover .command-icon { transform: rotate(-5deg) scale(1.12); }
.command-sheen { position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(90deg, transparent, rgba(155,124,255,.2), transparent); transition: transform .55s ease; }
.command-button:hover .command-sheen { transform: translateX(120%); }

.flip-shell { width: min(17.5rem, 86vw); height: 20rem; padding: 0; border: 0; color: inherit; background: transparent; perspective: 1100px; }

.flip-shell.is-flipped .flip-card { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 1.35rem; overflow: hidden; border: 1px solid #363943; border-radius: 1.25rem; backface-visibility: hidden; text-align: left; background: linear-gradient(155deg, #24262c, #0f1014); box-shadow: 0 1.5rem 4rem rgba(0,0,0,.28); }

.flip-face small { color: #aaa7a0; line-height: 1.5; }

.flip-orbit { position: absolute; width: 6.25rem; height: 6.25rem; left: calc(50% - 3.125rem); top: 3rem; border: 1px solid rgba(255,155,86,.7); border-radius: 50%; box-shadow: 0 0 3rem rgba(255,155,86,.35); animation: orbit-pulse 2.2s ease-in-out infinite alternate; }
.flip-back { transform: rotateY(180deg); gap: .6rem; }

.flip-list span { opacity: .9; }

.hold-button { position: relative; width: min(15rem, 100%); min-height: 3rem; margin-top: 1.2rem; overflow: hidden; border: 1px solid rgba(248,113,113,.42); border-radius: .75rem; color: #fecaca; background: rgba(127,29,29,.3); touch-action: none; }
.hold-progress { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(248,113,113,.28); }

.hold-label { position: relative; z-index: 1; }

.paths-stage { width: min(100%, 48rem); min-height: 19rem; overflow: hidden; border: 1px solid var(--line); border-radius: 1.5rem; background: #08090d; }

.component-toolbar button { min-height: 2.75rem; padding: .6rem .8rem; border: 0; border-radius: .7rem; color: #a7a4a0; background: transparent; transition: color .2s ease, background .2s ease, transform .2s ease; }

.toolbar-icon { display: block; font-size: 1.05rem; }
.toolbar-status { margin: .8rem 0 0; color: #b8b4ac; text-align: center; }

.tab-demo { width: min(100%, 30rem); display: grid; gap: 1rem; }

.smooth-tabs { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .25rem; padding: .35rem; border: 1px solid var(--line); border-radius: .9rem; background: #121319; }

.typewriter-stage { min-height: 13rem; }

.spotlight-stage { width: min(100%, 42rem); align-content: center; gap: 1.25rem; padding: 1.25rem; border: 1px solid var(--line); border-radius: 1.5rem; background: radial-gradient(circle at 12% 5%, rgba(155,124,255,.14), transparent 36%), #090a10; }
.spotlight-heading { justify-self: stretch; }
.spotlight-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .65rem; perspective: 900px; }
.spotlight-card { position: relative; min-width: 0; min-height: 8.5rem; display: flex; flex-direction: column; gap: .55rem; padding: .9rem; overflow: hidden; border: 1px solid rgba(255,255,255,.1); border-radius: 1rem; background: radial-gradient(circle at var(--gx,20%) var(--gy,20%), color-mix(in srgb, var(--spot) 20%, transparent), transparent 62%), rgba(255,255,255,.035); transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition: transform .16s ease, opacity .18s ease, border-color .18s ease; }

@keyframes orbit-pulse { to { transform: scale(.72); opacity: .38; } }
@keyframes path-flow { to { stroke-dashoffset: -228; } }

  function repeating(callback, delay) {
    let timer = 0;

  function renderActionSearchBar() {
    const stage = adapterStage('action-search-adapter');
    const shell = element('div', 'action-search-shell');
    shell.append(element('p', 'k-eyebrow', 'ACTION SEARCH · LOCAL COMMANDS'));
    const input = element('input', 'k-field action-search-input');

    input.placeholder = '搜尋命令…';
    input.setAttribute('aria-label', '搜尋本機示範命令');
    const list = element('div', 'action-search-results');
    list.setAttribute('role', 'listbox');
    const status = statusLine('按 Ctrl／⌘ + K 可聚焦搜尋');
    let activeIndex = 0;
    const commands = [
      ['建立文件', '⌘ N'], ['搜尋專案', '⌘ P'], ['切換主題', '⌘ T'], ['開啟設定', '⌘ ,']
    ];
    const draw = () => {
      const query = input.value.trim().toLocaleLowerCase();
      const visible = commands.filter(([name]) => name.toLocaleLowerCase().includes(query));
      list.replaceChildren();
      activeIndex = Math.min(activeIndex, Math.max(0, visible.length - 1));
      visible.forEach(([name, key], index) => {
        const option = localButton('', 'action-search-option');
        option.setAttribute('role', 'option');
        option.append(element('span', '', name), element('kbd', '', key));
        option.addEventListener('click', () => { status.textContent = `已選取：${name}（僅示範，不執行命令）`; });
        if (index === activeIndex) option.classList.add('is-active');
        list.append(option);

      if ((event.ctrlKey || event.metaKey) && event.key.toLocaleLowerCase() === 'k') {
        event.preventDefault(); input.focus(); status.textContent = '命令搜尋已聚焦';

      if (event.key === 'Escape' && document.activeElement === input) { input.value = ''; draw(); input.blur(); }

      const options = [...list.querySelectorAll('button')];

        event.preventDefault(); activeIndex = (activeIndex + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % Math.max(1, options.length); draw();

    window.addEventListener('keydown', keyHandler);
    cleanups.push(() => window.removeEventListener('keydown', keyHandler));
    shell.append(input, list, status); stage.append(shell); root.append(stage); draw();
  }

  function renderAttractButton() {

  function renderFlowField() {
    const stage = adapterStage('flow-field-adapter', 'flow-field-stage');
    const canvas = element('canvas', 'flow-field-canvas'); canvas.width = 640; canvas.height = 300; canvas.setAttribute('aria-label', '本機粒子流場動畫');
    const context = canvas.getContext('2d');
    const points = Array.from({ length: 72 }, (_, index) => ({ x: (index * 83) % canvas.width, y: (index * 47) % canvas.height, phase: index * .37 }));
    const pointer = { x: canvas.width / 2, y: canvas.height / 2 };
    let frame = 0; let raf = 0;
    const draw = () => {
      raf = 0;
      if (running && context) {
        frame += .018; context.fillStyle = 'rgba(9,10,15,.2)'; context.fillRect(0, 0, canvas.width, canvas.height);
        points.forEach((point, index) => {
          const angle = Math.sin(point.y * .014 + frame + point.phase) + Math.cos(point.x * .012 - frame);
          const dx = pointer.x - point.x; const dy = pointer.y - point.y; const distance = Math.max(42, Math.hypot(dx, dy));
          point.x += Math.cos(angle) * 1.25 + dx / distance * .08; point.y += Math.sin(angle) * 1.25 + dy / distance * .08;
          if (point.x < 0) point.x = canvas.width; if (point.x > canvas.width) point.x = 0; if (point.y < 0) point.y = canvas.height; if (point.y > canvas.height) point.y = 0;
          context.fillStyle = `hsla(${180 + (index % 8) * 9},90%,65%,.7)`; context.beginPath(); context.arc(point.x, point.y, 1.35, 0, Math.PI * 2); context.fill();
        });
        raf = requestAnimationFrame(draw);
      }
    };
    canvas.addEventListener('pointermove', (event) => { const box = canvas.getBoundingClientRect(); pointer.x = (event.clientX - box.left) / box.width * canvas.width; pointer.y = (event.clientY - box.top) / box.height * canvas.height; });
    const copy = element('div', 'flow-field-copy'); copy.append(element('p', 'k-eyebrow', 'FLOW FIELD'), element('strong', '', 'Move through the current'));
    const ensureFlowAnimation = () => { if (running && !raf) raf = requestAnimationFrame(draw); };
    stage.append(canvas, copy); root.append(stage); ensureFlowAnimation(); resumeHooks.push(ensureFlowAnimation); cleanups.push(() => { if (raf) cancelAnimationFrame(raf); raf = 0; });
  }

    status.setAttribute('role', 'status');
    let completionTimer = 0;
    const stop = () => {
      window.clearTimeout(completionTimer);
      button.classList.remove('is-holding');
      button.querySelector('.hold-label').textContent = '⌫  Hold me';
      if (status.textContent !== '操作已確認') status.textContent = '已放開；進度重設';
    };
    const start = (event) => {
      event.preventDefault();
      if (!running) return;
      window.clearTimeout(completionTimer);
      button.classList.add('is-holding');
      button.querySelector('.hold-label').textContent = 'Release';
      status.textContent = '持續按住…';
      completionTimer = window.setTimeout(() => {
        if (!running) return;
        status.textContent = '操作已確認';
        button.classList.remove('is-holding');
        button.querySelector('.hold-label').textContent = '✓  Complete';
      }, 1600);
    };
    button.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((name) => button.addEventListener(name, stop));
    button.addEventListener('keydown', (event) => { if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) start(event); });
    button.addEventListener('keyup', (event) => { if (event.key === ' ' || event.key === 'Enter') stop(); });
    cleanups.push(() => window.clearTimeout(completionTimer));
    node.append(button, status);
    root.append(node);
  }

  function renderBackgroundPaths() {
    const stage = section('stage');
    stage.classList.add('paths-stage');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 900 360');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', '流動漸層路徑背景');
    for (let index = 0; index < 18; index += 1) {
      const pathNode = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const y = 40 + index * 16;
      pathNode.setAttribute('d', `M -50 ${y} C 180 ${y - 100}, 300 ${y + 105}, 490 ${y - 20} S 760 ${y + 85}, 950 ${y - 55}`);
      pathNode.style.setProperty('--i', index);
      svg.append(pathNode);
    }
    const heading = element('div', 'paths-copy');
    heading.append(element('p', 'k-eyebrow', 'BACKGROUND PATHS'), element('h1', 'k-title', 'Flow with intention'));
    stage.append(svg, heading);
    root.append(stage);
  }

  function buildToolbarButton(label, symbol) {
    const button = element('button', '', label);
    button.type = 'button';
    button.prepend(element('span', 'toolbar-icon', symbol));
    return button;
  }

  function renderToolbar() {
    const stage = section();
    const toolbar = element('div', 'component-toolbar');
    toolbar.setAttribute('role', 'toolbar');
    const status = element('p', 'toolbar-status', '選取：Pointer');
    status.setAttribute('role', 'status');
    [['Pointer', '↖'], ['Frame', '□'], ['Comment', '◌'], ['Share', '↗']].forEach(([label, symbol], index) => {
      const button = buildToolbarButton(label, symbol);
      button.classList.toggle('is-active', index === 0);
      button.addEventListener('click', () => {
        toolbar.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
        button.classList.add('is-active');
        status.textContent = `選取：${label}`;
      });
      toolbar.append(button);
    });
    stage.append(toolbar, status);
    root.append(stage);
  }

  function renderSmoothTab() {
    const stage = section('tab-demo');
    const card = element('div', 'tab-card');
    const tabs = element('div', 'smooth-tabs');
    tabs.setAttribute('role', 'tablist');
    const items = [
      ['overview', 'Overview', 'Realtime product overview', 'Track the signal that matters.'],
      ['activity', 'Activity', 'Recent team activity', 'See changes without leaving context.'],
      ['insights', 'Insights', 'Focused performance insights', 'Compare trends and decide faster.'],
      ['settings', 'Settings', 'Workspace controls', 'Tune permissions and preferences.']
    ];
    const activate = (id) => {
      const item = items.find(([value]) => value === id);
      card.replaceChildren(element('p', 'k-eyebrow', item[1]), element('h1', 'k-title', item[2]), element('p', 'k-copy', item[3]));
      tabs.querySelectorAll('button').forEach((button) => {
        const selected = button.dataset.tab === id;
        button.classList.toggle('is-active', selected);
        button.setAttribute('aria-selected', String(selected));
        button.tabIndex = selected ? 0 : -1;
      });
    };
    items.forEach(([id, label]) => {
      const button = element('button', '', label);
      button.type = 'button';
      button.dataset.tab = id;
      button.setAttribute('role', 'tab');
      button.addEventListener('click', () => activate(id));
      tabs.append(button);
    });
    stage.append(card, tabs);
    root.append(stage);
    activate('overview');
  }

  function renderTypeWriter() {
    const stage = section('typewriter-stage');
    const line = element('p', 'typewriter-line');
    const text = element('span');
    const cursor = element('span', 'typewriter-cursor');
    cursor.setAttribute('aria-hidden', 'true');
    line.append(text, cursor);
    stage.append(line);
    root.append(stage);
    const sequences = ['Typewriter', 'Multiple Words', 'Auto Loop'];
    let sequenceIndex = 0;
    let charIndex = 0;
    let deleting = false;
    let timer = 0;
    const tick = () => {
      const target = sequences[sequenceIndex];
      if (!running) { timer = window.setTimeout(tick, 180); return; }
      charIndex += deleting ? -1 : 1;
      text.textContent = target.slice(0, Math.max(0, charIndex));
      let delay = deleting ? 45 : 75;
      if (!deleting && charIndex >= target.length) { deleting = true; delay = 850; }
      if (deleting && charIndex <= 0) { deleting = false; sequenceIndex = (sequenceIndex + 1) % sequences.length; delay = 180; }
      timer = window.setTimeout(tick, delay);
    };
    timer = window.setTimeout(tick, 220);
    cleanups.push(() => window.clearTimeout(timer));
  }

  function renderSpotlightCards() {
    const stage = section('spotlight-stage');
    const heading = element('div', 'spotlight-heading');
    heading.append(element('p', 'k-eyebrow', 'FEATURES'), element('h1', 'k-title', 'Everything you need'));
    const grid = element('div', 'spotlight-grid');
    [['Instant', 'Sub-100ms feedback', '#f59e0b'], ['Secure', 'Zero-trust by default', '#60a5fa'], ['Global', 'Designed for every region', '#34d399'], ['Developer first', 'Clear tools and honest docs', '#a78bfa'], ['Scalable', 'Grows with your project', '#38bdf8'], ['Local ready', 'No remote preview assets', '#f472b6']].forEach(([title, copy, color]) => {
      const card = element('article', 'spotlight-card');
      card.style.setProperty('--spot', color);
      card.append(element('span', 'spotlight-icon', '✦'), element('strong', '', title), element('small', '', copy));
      card.addEventListener('pointermove', (event) => {
        if (!running) return;
        const box = card.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width - .5;
        const y = (event.clientY - box.top) / box.height - .5;
        card.style.setProperty('--rx', `${(-y * 10).toFixed(2)}deg`);
        card.style.setProperty('--ry', `${(x * 10).toFixed(2)}deg`);
        card.style.setProperty('--gx', `${((x + .5) * 100).toFixed(1)}%`);
        card.style.setProperty('--gy', `${((y + .5) * 100).toFixed(1)}%`);
      });
      card.addEventListener('pointerenter', () => grid.classList.add('has-focus'));
      card.addEventListener('pointerleave', () => {
        grid.classList.remove('has-focus');
        card.style.removeProperty('--rx'); card.style.removeProperty('--ry');
      });
      grid.append(card);
    });
    stage.append(heading, grid);
    root.append(stage);
  }

  const renderers = {
    'action-search-bar': renderActionSearchBar,
    'ai-input-search': renderAIInputSearch,
    'ai-loading': renderAILoading,
    'ai-prompt': renderAIPrompt,
    'ai-text-loading': renderAITextLoading,
    'ai-voice': renderAIVoice,
    'apple-activity-card': renderAppleActivityCard,
    'attract-button': renderAttractButton,
    'avatar-picker': renderAvatarPicker,
    'background-paths': renderBackgroundPaths,
    'beams-background': renderBeamsBackground,
    'bento-grid': renderBentoGrid,
    'card-flip': renderCardFlip,
    'card-stack': renderCardStack,
    'carousel-cards': renderCarouselCards,
    'command-button': renderCommandButton,
    'currency-transfer': renderCurrencyTransfer,
    'dynamic-text': renderDynamicText,
    'file-upload': renderFileUpload,
    'flow-field': renderFlowField,
    'glitch-text': renderGlitchText,
    'gradient-button': renderGradientButton,
    'hold-button': renderHoldButton,
    'liquid-glass-card': renderLiquidGlassCard,
    'loader': renderLoader,
    'matrix-text': renderMatrixText,
    'morphic-navbar': renderMorphicNavbar,
    'mouse-effect-card': renderMouseEffectCard,
    'particle-button': renderParticleButton,
    'profile-dropdown': renderProfileDropdown,
    'scroll-text': renderScrollText,
    'shape-hero': renderShapeHero,
    'shimmer-text': renderShimmerText,
    'sliced-text': renderSlicedText,
    'slide-text-button': renderSlideTextButton,
    'smooth-tab': renderSmoothTab,
    'social-button': renderSocialButton,
    'spotlight-cards': renderSpotlightCards,
    'switch-button': renderSwitchButton,
    'swoosh-text': renderSwooshText,
    'team-selector': renderTeamSelector,
    'toolbar': renderToolbar,
    'tweet-card': renderTweetCard,
    'type-writer': renderTypeWriter
  };

  function setPlayback(action) {
    requestedRunning = action === 'resume';
    running = requestedRunning && !reducedMotion.matches;
    document.body.classList.toggle('is-paused', !running);
    if (running) resumeHooks.forEach((resume) => resume());
  }

  function applyPlaybackPreference() {
    running = requestedRunning && !reducedMotion.matches;
    document.body.classList.toggle('is-paused', !running);
    if (running) resumeHooks.forEach((resume) => resume());
  }

  function renderCurrentPreview() {
    cleanups.splice(0).forEach((cleanup) => cleanup());
    resumeHooks.length = 0;
    slug = decodeURIComponent(location.hash.replace(/^#/, ''));
    root.replaceChildren();
    if (!allowed.has(slug) || !renderers[slug]) {
      root.append(panel('預覽未納入', '此元件尚未通過逐項本機靜態適配驗證。'));
    } else {
      renderers[slug]();
    }
    applyPlaybackPreference();
  }

  renderCurrentPreview();
  window.addEventListener('hashchange', renderCurrentPreview);

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.type !== 'prompt-library-preview') return;
    if (message.action === 'pause' || message.action === 'resume') setPlayback(message.action);
  });
  window.addEventListener('pagehide', () => {
    running = false;
    cleanups.forEach((cleanup) => cleanup());
  });
  const handleReducedMotionChange = () => applyPlaybackPreference();
  if (typeof reducedMotion.addEventListener === 'function') reducedMotion.addEventListener('change', handleReducedMotionChange);
  else if (typeof reducedMotion.addListener === 'function') reducedMotion.addListener(handleReducedMotionChange);
  if (window.parent !== window) window.parent.postMessage({ type: 'prompt-library-preview-ready' }, '*');
})();
</script>
